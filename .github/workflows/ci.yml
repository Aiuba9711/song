name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emprego
          POSTGRES_PASSWORD: emprego
          POSTGRES_DB: emprego_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emprego"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://emprego:emprego@localhost:5432/emprego_test?schema=public
      APP_URL: http://localhost:3100
      APP_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage-test
      EMAIL_DRIVER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
